[package]
name = "denki"
version = "0.1.4"
description = "A compact desktop music player built with Tauri and Rust"
edition = "2021"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "denki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
denki-core = { path = "../crates/denki-core" }

[target.'cfg(not(target_os = "android"))'.dependencies]
souvlaki = "0.8"
dirs = "5"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2"
tauri-plugin-android-fs = "29"
serde = { version = "1", features = ["derive"] }
