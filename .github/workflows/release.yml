name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag matches app version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const expectedTag = `v${version}`;
            if (context.ref !== `refs/tags/${expectedTag}`) {
              const actualTag = context.ref.replace('refs/tags/', '');
              core.setFailed(`Release tag ${actualTag} must match app version tag ${expectedTag}.`);
            }

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            xdg-utils \
            file \
            curl \
            wget \
            build-essential \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev \
            rpm

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Denki ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.platform == 'windows-latest' && '--bundles nsis' || '' }}
